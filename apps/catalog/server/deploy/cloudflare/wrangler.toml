name = "catalog"
main = "worker.ts"
compatibility_date = "2026-05-01"

# Replace this id with the KV namespace you create:
#   wrangler kv:namespace create CATALOG_KV
[[kv_namespaces]]
binding = "CATALOG_KV"
id = "c46dbd843c834eabb842028b1bd700e1"

# Set with: wrangler secret put WEBHOOK_SECRET
# Set with: wrangler secret put GITHUB_TOKEN

# Dev env override (`CATALOG_CONTENT_BASE`) is set via `wrangler dev --var`
# in package.json, NOT here — `[env.X]` blocks in wrangler.toml don't
# inherit top-level kv_namespaces, so introducing `--env dev` silently
# drops the CATALOG_KV binding and every cached route 500s.
