name = "tick"
main = "src/worker.ts"
compatibility_date = "2026-05-11"
compatibility_flags = ["nodejs_compat"]

# Custom domain — points at tick.frames.ag.
# routes = [{ pattern = "tick.frames.ag/*", custom_domain = true }]

[vars]
# Sibling CF Container app that wraps Faremeter for x402/MPP verify+settle.
# Wired in week 1; overridden per-environment for staging/preview.
FACILITATOR_URL = "https://tick-facilitator.frames.ag"

# Cloudflare Coinbase Developer Platform fallback for x402 verify+settle
# when our Faremeter instance is unavailable. Disabled until week 5 hardening.
# CDP_FALLBACK_URL = "https://api.cdp.coinbase.com/x402"

# ---------------------------------------------------------------------------
# D1 — receipts store
# Apply migrations: `bunx wrangler d1 migrations apply tick-receipts --local|--remote`
# Create database one-time: `bunx wrangler d1 create tick-receipts` → paste id below
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "tick-receipts"
database_id = "1c044e5e-2639-4f0e-b162-82c4ca4eb43a"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Service binding → frames-cloud Worker.
# Required because Workers can't reach each other's *.workers.dev URLs via
# raw fetch — Cloudflare returns 404+1042. The binding routes the request
# directly inside CF's edge.
# ---------------------------------------------------------------------------
[[services]]
binding = "FRAMES_CLOUD"
service = "frames-cloud"

# ---------------------------------------------------------------------------
# Workers AI binding — used both for CF-hosted models (@cf/...) and partnered
# third-party models (anthropic/*, openai/*, etc.). Cloudflare bills directly
# for both. Optionally routes through the AI Gateway for logging by passing
# `{ gateway: { id: 'frames-ai-gateway' } }` in the run() options.
# ---------------------------------------------------------------------------
[ai]
binding = "AI"

# ---------------------------------------------------------------------------
# Durable Objects
# ---------------------------------------------------------------------------
# EntityAgent: one DO instance per (run_id, entity_id). Hosts the bounded
# refresh-entity sub-loop. Parent invokes 1-N concurrently via Promise.all;
# each DO instance has its own CPU budget — true parallelism beyond the
# parent Worker's 30s ceiling. Phase C of the cost architecture.
[[durable_objects.bindings]]
name = "ENTITY_AGENT"
class_name = "EntityAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EntityAgent"]

# ---------------------------------------------------------------------------
# Week 4 — Sandboxes + R2
# ---------------------------------------------------------------------------
# [[r2_buckets]]
# binding = "R2_ARTIFACTS"
# bucket_name = "tick-artifacts"

# ---------------------------------------------------------------------------
# Secrets (set via `wrangler secret put`)
# ---------------------------------------------------------------------------
# AI_GATEWAY_TOKEN     — AI Gateway BYOK auth
# WALLET_SIGNER_KEY    — Coinbase Agentic Wallet API key for outbound x402 signing
