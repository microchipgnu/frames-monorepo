name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # Guard against the "merged a package fix but it never published" failure
  # mode: every PR that changes a publishable package must carry a changeset.
  # `changeset status --since` exits non-zero when changed packages have no
  # changeset (it respects .changeset/config.json `ignore`). For an
  # intentional no-release change, add an empty changeset:
  #   bunx changeset add --empty
  changeset-check:
    name: Changeset present
    runs-on: ubuntu-latest
    # Only on PRs, and skip the release bot's "Version Packages" PR — that PR
    # legitimately deletes changesets and bumps versions.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Require a changeset for package changes
        run: |
          git fetch origin "${{ github.base_ref }}"
          bunx changeset status --since="origin/${{ github.base_ref }}"

  typecheck:
    name: Typecheck (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # catalog/server intentionally excluded — it targets Cloudflare Workers
        # and needs @cloudflare/workers-types config that's only present at
        # deploy time. Add it back once that's wired in tsconfig.
        package:
          - packages/pay
          - packages/frame
          - packages/payment-tempo
          - packages/tick-types
          - apps/frames-cloud
          - apps/tick
          - apps/tick-facilitator
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --cwd ${{ matrix.package }} typecheck

  smoke-pay:
    name: Pay smoke (manifest, types, persistence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/pay smoke:roundtrip
      - run: bun run --cwd packages/pay smoke:manifest
      - run: bun run --cwd packages/pay smoke:persistence

  test-frame:
    name: Frame tests (bun test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/frame test

  test-tick:
    name: Tick tests (bun test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/tick test
      - run: bun run --cwd apps/tick smoke

  test-payment-tempo:
    name: payment-tempo smoke (Phase A — structural routing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/payment-tempo smoke
