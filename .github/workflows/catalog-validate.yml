name: catalog-validate

# Sanity-check every descriptor JSON in apps/catalog/content/tools/.
# Catches malformed entries before they hit the live catalog (which reads
# from this repo's main branch via raw.githubusercontent.com).

on:
  pull_request:
    paths:
      - 'apps/catalog/content/**'
      - '.github/workflows/catalog-validate.yml'
  push:
    branches: [main]
    paths:
      - 'apps/catalog/content/**'

jobs:
  descriptors:
    name: Descriptor JSON shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate every descriptor
        working-directory: apps/catalog
        run: |
          set -euo pipefail
          for f in content/tools/*.json; do
            echo "→ $f"
            jq empty "$f"
            jq -e '.pay_protocol == "0.0.1"' "$f" > /dev/null || { echo "missing pay_protocol"; exit 1; }
            jq -e '.id and .title and .description and .capabilities and .invocation and .payment' "$f" > /dev/null || { echo "missing required field"; exit 1; }
            jq -e '.invocation.method and .invocation.url' "$f" > /dev/null || { echo "missing invocation.method/url"; exit 1; }
            jq -e '.payment.protocol' "$f" > /dev/null || { echo "missing payment.protocol"; exit 1; }
            id=$(jq -r '.id' "$f")
            base=$(basename "$f" .json)
            [ "$id" = "$base" ] || { echo "filename $base does not match descriptor id $id"; exit 1; }
          done
